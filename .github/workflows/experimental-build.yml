name: Experimental Geyser 26.2 + Bedrock 26.66 build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - name: Check out this build recipe
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Attempt backport and compile
        run: bash ./build.sh
      - name: Archive experimental jar (only when build succeeds)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Geyser-Fabric-Java26.2-Bedrock26.66-EXPERIMENTAL
          path: out/*.jar
          if-no-files-found: error
